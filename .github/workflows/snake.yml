name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch: # run it once by hand after the first push

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colours match the header palette (periwinkle dots, mint snake)
          outputs: |
            dist/snake-light.svg?color_snake=#0c9a80&color_dots=#ebeef2,#cdd3fa,#9ea9f2,#6b78e3,#4f5bd5
            dist/snake-dark.svg?color_snake=#5fe0c4&color_dots=#161b22,#1f2747,#33408a,#5a6bd6,#8b9dff

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
