name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch: # run it once by hand after the first push

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colours match the header palette (Recurssive purples, ink snake)
          outputs: |
            dist/snake-light.svg?color_snake=#1a1530&color_dots=#ebeef2,#e2dcff,#b8adff,#7856ec,#4813d0
            dist/snake-dark.svg?color_snake=#f3f1fa&color_dots=#161b22,#241d47,#3b2a9a,#6a4cf0,#a59bff

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
